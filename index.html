<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Suscripciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: white; }
        select { padding: 6px; margin-right: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 6px 12px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Lista de Todos los Usuarios</h2>
    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Suscripción</th>
                <th>Monto</th>
                <th>Fecha de Pago</th>
                <th>Estado Premium</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios">
            <!-- Los datos se llenarán automáticamente desde Firebase -->
        </tbody>
    </table>

    <!-- SDK de Firebase (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración real de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para cargar todos los usuarios de la base de datos
        async function cargarSolicitudes() {
            const tbody = document.getElementById("tabla-usuarios");
            tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Cargando datos...</td></tr>";

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                tbody.innerHTML = ""; // Limpiar texto de carga

                let contador = 0;
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    contador++;
                    
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${data.nickname || data.nombre || 'Sin nombre'}</td>
                        <td>${data.email || 'Sin correo'}</td>
                        <td><b>${data.billingCycle || data.proPlanType || 'No especificado'}</b></td>
                        <td>${data.amount !== undefined ? '$' + data.amount : 'N/A'}</td>
                        <td>${data.paymentDate || 'N/A'}</td>
                        <td>${data.isPremium ? 'Activo (Premium)' : 'Inactivo (Pendiente)'}</td>
                        <td>
                            ${!data.isPremium ? `
                                <select id="duracion-${documento.id}">
                                    <option value="30">30 Días (Mensual)</option>
                                    <option value="365">1 Año (Anual)</option>
                                </select>
                                <button onclick="activarUsuario('${documento.id}')">Activar</button>
                            ` : 'Aprobado'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                if (contador === 0) {
                    tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>No hay usuarios registrados en la base de datos.</td></tr>";
                }

            } catch (error) {
                console.error("Error al cargar:", error);
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:red;'>Error al conectar con la base de datos.</td></tr>";
            }
        }

        // Función global para activar la cuenta según el tiempo seleccionado
        window.activarUsuario = async function(userId) {
            const selectElement = document.getElementById(`duracion-${userId}`);
            const diasSeleccionados = parseInt(selectElement.value);
            
            const tipoTexto = diasSeleccionados === 365 ? "1 Año (Anual)" : "30 Días (Mensual)";
            if (!confirm(`¿Estás seguro de activar la cuenta por ${tipoTexto}?`)) return;

            const fechaActual = new Date();
            const fechaExpiracion = new Date();
            fechaExpiracion.setDate(fechaActual.getDate() + diasSeleccionados);

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    isPremium: true,
                    activatedAt: fechaActual.toISOString(),
                    subscriptionExpiry: fechaExpiracion.toISOString(),
                    planDurationDays: diasSeleccionados
                });

                alert(`¡Cuenta activada con éxito por ${tipoTexto}!`);
                cargarSolicitudes(); // Recarga la tabla
            } catch (error) {
                console.error("Error al activar: ", error);
                alert("Hubo un error al activar la cuenta.");
            }
        }

        // Ejecutar al cargar la página
        cargarSolicitudes();
    </script>
</body>
</html>
