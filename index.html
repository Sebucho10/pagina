<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Suscripciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: white; }
        button { padding: 6px 12px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Solicitudes de Suscripción Pendientes</h2>
    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Monto</th>
                <th>Fecha de Pago</th>
                <th>Estado Premium</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios">
            <!-- Los datos se llenarán automáticamente desde Firebase -->
        </tbody>
    </table>

    <!-- SDK de Firebase (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDate, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "dpdefault-48735",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para cargar los usuarios que tienen un pago registrado
        async function cargarSolicitudes() {
            const tbody = document.getElementById("tabla-usuarios");
            tbody.innerHTML = "";

            const querySnapshot = await getDocs(collection(db, "users"));
            querySnapshot.forEach((documento) => {
                const data = documento.data();
                
                // Filtramos solo los que tengan datos de pago (ej. amount > 0)
                if (data.amount && data.amount > 0) {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${data.nickname || 'Sin nombre'}</td>
                        <td>${data.email}</td>
                        <td>$${data.amount}</td>
                        <td>${data.paymentDate || 'N/A'}</td>
                        <td>${data.isPremium ? 'Activo (Premium)' : 'Inactivo (Pendiente)'}</td>
                        <td>
                            ${!data.isPremium ? `<button onclick="activarUsuario('${documento.id}')">Activar</button>` : 'Aprobado'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        // Función global para activar la cuenta y calcular los 30 días de vencimiento
        window.activarUsuario = async function(userId) {
            const fechaActual = new Date();
            const fechaExpiracion = new Date();
            fechaExpiracion.setDate(fechaActual.getDate() + 30); // Suma 30 días exactos

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    isPremium: true,
                    activatedAt: fechaActual.toISOString(),
                    subscriptionExpiry: fechaExpiracion.toISOString()
                });

                alert("¡Cuenta activada con éxito! El vencimiento se calculó automáticamente.");
                cargarSolicitudes(); // Recarga la tabla
            } catch (error) {
                console.error("Error al activar: ", error);
                alert("Hubo un error al activar la cuenta.");
            }
        }

        // Ejecutar al cargar la página
        cargarSolicitudes();
    </script>
</body>
</html>
