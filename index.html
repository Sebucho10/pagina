<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; color: #15803d; font-size: 1.5rem; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .details {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #475569;
            margin-bottom: 20px;
            word-break: break-all;
            text-align: left;
        }
        .btn {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            cursor: pointer;
            border: none;
        }
        .btn:hover { background-color: #4338ca; }
    </style>
</head>
<body>

    <div class="card">
        <div class="success-icon">🟢</div>
        <h2>¡Pago Exitoso!</h2>
        <p>Tu transacción se ha completado correctamente. Estamos redirigiéndote a tu aplicación...</p>
        
        <div class="details" id="detalleTransaccion">
            Cargando datos de la transacción...
        </div>

        <button id="btnVolver" class="btn">Volver a la Aplicación</button>
    </div>

    <script>
        // =========================================================================
        // ⚙️ CONFIGURACIÓN DE TU APLICACIÓN ANDROID
        // =========================================================================
        // 1. Reemplaza con tu esquema personalizado (ej: "sebasapp")
        const schemeName = "sebasapp"; 
        const hostAction = "pago-exitoso";
        
        // 2. Reemplaza con el Package Name real de tu app Android (ej: "com.sebas.miapp")
        const androidPackageName = "com.sebas.app"; 
        // =========================================================================

        // Capturar los parámetros enviados por PayPal en la URL actual
        const urlParams = new URLSearchParams(window.location.search);
        const txId = urlParams.get('tx') || 'N/A';
        const amount = urlParams.get('amt') || '0.00';
        const currency = urlParams.get('cc') || 'USD';

        // Mostrar información útil en la tarjeta visual
        document.getElementById("detalleTransaccion").innerHTML = `
            <b>Transacción:</b> ${txId}<br>
            <b>Monto:</b> ${amount} ${currency}
        `;

        // Construir los enlaces de redirección para Android y navegadores generales
        const customSchemeUrl = `${schemeName}://${hostAction}?tx=${txId}&amt=${amount}&cc=${currency}`;
        
        // Intent URI optimizado para Android (fuerza la apertura de la app o redirige al fallback si no está instalada)
        const androidIntentUrl = `intent://${hostAction}?tx=${txId}&amt=${amount}&cc=${currency}#Intent;scheme=${schemeName};package=${androidPackageName};end;`;

        const btnVolver = document.getElementById("btnVolver");
        btnVolver.onclick = function() {
            window.location.href = androidIntentUrl;
        };

        // Intentar la redirección automática de forma segura al cargar la página
        window.onload = function() {
            setTimeout(() => {
                // Probamos primero con el Intent de Android
                window.location.replace(androidIntentUrl);
            }, 600);
        };
    </script>
</body>
</html>
