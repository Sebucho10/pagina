<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPdefault Pro - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --system-blue: #007AFF;
            --system-green: #34C759;
            --system-red: #FF3B30;
            --system-gray: #8E8E93;
            --system-bg: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #000000;
            --text-secondary: #3C3C43;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body { 
            font-family: 'SF Pro Display', 'Inter', -apple-system, sans-serif; 
            background-color: var(--system-bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Estilo iOS Header */
        header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }

        /* Buscador iOS */
        .search-container { position: relative; width: 300px; }
        .search-container input {
            width: 100%;
            background: rgba(118, 118, 128, 0.12);
            border: none;
            border-radius: 10px;
            padding: 8px 12px 8px 35px;
            font-size: 17px;
            outline: none;
        }
        .search-icon { position: absolute; left: 10px; top: 10px; color: var(--system-gray); }

        /* Filtros de Estado */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            background: #E5E5EA;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-chip.active { background: var(--system-blue); color: white; }

        /* Notificaciones Estilo iOS */
        #notification-center { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .notification {
            width: 320px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .notif-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
        .notif-success { background: var(--system-green); }
        .notif-danger { background: var(--system-red); }

        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        /* Tabla Estilo iOS */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            overflow: hidden;
            border: 0.5px solid rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 15px; font-size: 13px; color: var(--system-gray); text-transform: uppercase; font-weight: 500; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        td { padding: 15px; border-bottom: 0.5px solid rgba(0,0,0,0.05); font-size: 15px; }

        .user-link { color: var(--system-blue); text-decoration: none; font-weight: 600; cursor: pointer; }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }
        .status-active { background: rgba(52, 199, 89, 0.15); color: var(--system-green); }
        .status-inactive { background: rgba(142, 142, 147, 0.15); color: var(--system-gray); }
        .status-expired { background: rgba(255, 59, 48, 0.15); color: var(--system-red); }

        /* Modal iOS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 24px; cursor: pointer; color: var(--system-gray); }

        /* Botones iOS */
        .btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-red { background: var(--system-red); color: white; }
        .btn-green { background: var(--system-green); color: white; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        select { background: #F2F2F7; border: none; padding: 8px; border-radius: 8px; font-size: 14px; outline: none; }
    </style>
</head>
<body>

    <div id="notification-center"></div>

    <div class="container">
        <header>
            <h1>DPdefault Pro</h1>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="buscador" placeholder="Buscar usuario..." onkeyup="filtrar()">
            </div>
        </header>

        <div class="filters">
            <div class="filter-chip active" onclick="setFilter('todos', this)">Todos</div>
            <div class="filter-chip" onclick="setFilter('pagado', this)">Pagos Nuevos</div>
            <div class="filter-chip" onclick="setFilter('expirado', this)">Expirados</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Pago el</th>
                        <th>Expira el</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-usuarios"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Historial -->
    <div id="modalHistorial" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h2 id="historialNombre" style="margin-bottom: 20px; font-size: 24px;">Historial</h2>
            <div id="loadingHistorial" style="display:none; text-align:center;">Cargando...</div>
            <table style="margin-top: 10px;">
                <thead id="historialHead">
                    <tr style="background:#F2F2F7">
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Fecha</th>
                        <th>Expiración</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let dataGlobal = [];
        let currentFilter = 'todos';
        const notifiedIds = new Set();

        // 1. Escucha en tiempo real y Notificaciones
        onSnapshot(collection(db, "users"), (snapshot) => {
            dataGlobal = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            snapshot.docChanges().forEach(change => {
                const user = change.doc.data();
                const id = change.doc.id;

                // Notificación Verde: Pago recibido en la app (sin activar todavía)
                if (user.paymentReceived === true && !user.isPremium && !notifiedIds.has(id + '_pay')) {
                    enviarNotificacion(`💰 Pago de ${user.nickname}`, 'Nuevo pago de $'+user.amount, 'success');
                    notifiedIds.add(id + '_pay');
                }

                // Notificación Roja: Expiración detectada
                const ahora = new Date();
                const exp = user.subscriptionExpiry ? new Date(user.subscriptionExpiry.replace(' ', 'T')) : null;
                if (user.isPremium && exp && ahora > exp && !notifiedIds.has(id + '_exp')) {
                    enviarNotificacion(`🚨 EXPIRADO: ${user.nickname}`, 'El plan de este usuario ya venció.', 'danger');
                    notifiedIds.add(id + '_exp');
                }
            });

            renderTable();
        });

        function enviarNotificacion(titulo, msg, tipo) {
            const container = document.getElementById("notification-center");
            const div = document.createElement("div");
            div.className = "notification";
            div.innerHTML = `
                <div class="notif-icon notif-${tipo}">${tipo === 'success' ? '✓' : '!'}</div>
                <div>
                    <div style="font-weight:700; font-size:15px;">${titulo}</div>
                    <div style="font-size:13px; color:var(--text-secondary)">${msg}</div>
                </div>
            `;
            container.appendChild(div);
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(()=>{});
            setTimeout(() => div.style.opacity = '0', 4500);
            setTimeout(() => div.remove(), 5000);
        }

        window.renderTable = () => {
            const tbody = document.getElementById("lista-usuarios");
            tbody.innerHTML = "";
            const ahora = new Date();

            let filtered = dataGlobal.filter(u => {
                const text = document.getElementById("buscador").value.toLowerCase();
                const matchText = (u.nickname || "").toLowerCase().includes(text) || (u.email || "").toLowerCase().includes(text);
                
                if (currentFilter === 'pagado') return matchText && u.paymentReceived && !u.isPremium;
                if (currentFilter === 'expirado') {
                    const exp = u.subscriptionExpiry ? new Date(u.subscriptionExpiry.replace(' ', 'T')) : null;
                    return matchText && u.isPremium && exp && ahora > exp;
                }
                return matchText;
            });

            filtered.sort((a,b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

            filtered.forEach(u => {
                const expDate = u.subscriptionExpiry ? new Date(u.subscriptionExpiry.replace(' ', 'T')) : null;
                const expired = expDate && ahora > expDate;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><a class="user-link" onclick="verHistorial('${u.id}', '${u.nickname}')">${u.nickname || 'Usuario'}</a><br><small style="color:gray">${u.email || ''}</small></td>
                    <td><b>${u.billingCycle || 'Ninguno'}</b></td>
                    <td>$${u.amount || '0.00'}</td>
                    <td>${u.paymentDate || '-'}</td>
                    <td style="color: ${expired ? 'var(--system-red)' : 'inherit'}; font-weight: ${expired ? '700' : 'normal'}">
                        ${u.subscriptionExpiry || '-'}
                    </td>
                    <td>
                        <span class="badge ${u.isPremium ? (expired ? 'status-expired' : 'status-active') : (u.paymentReceived ? 'status-inactive' : 'status-inactive')}">
                            ${u.isPremium ? (expired ? 'EXPIRADO' : 'ACTIVO') : (u.paymentReceived ? 'PAGADO' : 'INACTIVO')}
                        </span>
                    </td>
                    <td>
                        <div style="display:flex; gap:8px;">
                            <select id="plan-${u.id}">
                                <option value="3">3 Días ($0.25)</option>
                                <option value="30" selected>1 Mes ($1.00)</option>
                                <option value="365">1 Año ($10.00)</option>
                            </select>
                            ${u.isPremium 
                                ? `<button class="btn btn-red" onclick="cambiarEstado('${u.id}', false)">Apagar</button>`
                                : `<button class="btn btn-green" onclick="activar('${u.id}')">Activar</button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.activar = async (id) => {
            const dias = parseInt(document.getElementById(`plan-${id}`).value);
            const precios = { 3: 0.25, 30: 1.00, 365: 10.00 };
            const nombres = { 3: "Prueba 3D", 30: "Mensual", 365: "Anual" };

            const ahora = new Date();
            const exp = new Date();
            exp.setDate(ahora.getDate() + dias);
            const fmt = (d) => d.toISOString().replace('T', ' ').split('.')[0];

            try {
                await updateDoc(doc(db, "users", id), {
                    isPremium: true,
                    paymentReceived: true,
                    amount: precios[dias],
                    billingCycle: nombres[dias],
                    paymentDate: fmt(ahora),
                    subscriptionExpiry: fmt(exp),
                    updatedAt: ahora
                });
                
                // Guardar en la subcolección de historial
                await addDoc(collection(db, "users", id, "payments"), {
                    plan: nombres[dias],
                    amount: precios[dias],
                    paymentDate: fmt(ahora),
                    expiresAt: fmt(exp),
                    timestamp: ahora.getTime()
                });
                
                enviarNotificacion("¡Activado!", "Usuario activado correctamente", "success");
            } catch (e) { alert(e.message); }
        };

        window.cambiarEstado = async (id, status) => {
            if(!confirm("¿Seguro?")) return;
            await updateDoc(doc(db, "users", id), { isPremium: status, paymentReceived: status, subscriptionExpiry: "EXPIRADO" });
        };

        window.verHistorial = async (id, nombre) => {
            document.getElementById("historialNombre").innerText = "Historial: " + nombre;
            const tbody = document.getElementById("tabla-historial");
            tbody.innerHTML = "";
            document.getElementById("modalHistorial").style.display = "flex";
            document.getElementById("loadingHistorial").style.display = "block";

            // Consultar historial
            const q = query(collection(db, "users", id, "payments"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            
            document.getElementById("loadingHistorial").style.display = "none";
            if(snapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>No hay pagos antiguos</td></tr>";
            }
            snapshot.forEach(d => {
                const p = d.data();
                tbody.innerHTML += `<tr><td>${p.plan}</td><td>$${p.amount}</td><td>${p.paymentDate}</td><td>${p.expiresAt}</td></tr>`;
            });
        };

        window.cerrarModal = () => document.getElementById("modalHistorial").style.display = "none";
        window.setFilter = (f, el) => {
            currentFilter = f;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderTable();
        };
        window.filtrar = () => renderTable();
    </script>
</body>
</html>
