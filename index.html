<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Suscripciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Estilo de la barra de búsqueda (Lupa) */
        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #fcfdfe;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-inactive {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            font-size: 13px;
            outline: none;
            margin-right: 8px;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-activar {
            background-color: var(--success);
            color: white;
        }
        .btn-activar:hover { background-color: var(--success-hover); }

        .btn-desactivar {
            background-color: var(--danger);
            color: white;
        }
        .btn-desactivar:hover { background-color: var(--danger-hover); }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">
            <h2>Gestión de Suscriptores</h2>
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
                <input type="text" id="buscador" placeholder="Buscar por usuario o correo..." onkeyup="filtrarUsuarios()">
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Suscripción</th>
                        <th>Monto</th>
                        <th>Fecha de Pago</th>
                        <th>Estado Premium</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaUsuariosGlobal = [];

        async function cargarSolicitudes() {
            const tbody = document.getElementById("tabla-usuarios");
            tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Cargando datos...</td></tr>";

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                listaUsuariosGlobal = [];

                querySnapshot.forEach((documento) => {
                    listaUsuariosGlobal.push({
                        id: documento.id,
                        ...documento.data()
                    });
                });

                renderizarTabla(listaUsuariosGlobal);

            } catch (error) {
                console.error("Error al cargar:", error);
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:red;'>Error al conectar con la base de datos.</td></tr>";
            }
        }

        window.renderizarTabla = function(usuarios) {
            const tbody = document.getElementById("tabla-usuarios");
            tbody.innerHTML = "";

            if (usuarios.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color: #64748b;'>No se encontraron registros.</td></tr>";
                return;
            }

            usuarios.forEach((data) => {
                const isPrem = data.isPremium === true;
                const tr = document.createElement("tr");
                
                tr.innerHTML = `
                    <td><strong>${data.nickname || data.nombre || 'Sin nombre'}</strong></td>
                    <td>${data.email || 'Sin correo'}</td>
                    <td><b>${data.billingCycle || data.proPlanType || 'No especificado'}</b></td>
                    <td>${data.amount !== undefined ? '$' + data.amount : 'N/A'}</td>
                    <td>${data.paymentDate || 'N/A'}</td>
                    <td><span class="badge ${isPrem ? 'badge-active' : 'badge-inactive'}">${isPrem ? 'Activo (Premium)' : 'Inactivo'}</span></td>
                    <td>
                        <div class="actions-cell">
                            <select id="duracion-${data.id}">
                                <option value="30">30 Días</option>
                                <option value="365">1 Año</option>
                            </select>
                            ${isPrem 
                                ? `<button class="btn-desactivar" onclick="cambiarEstado('${data.id}', false)">Desactivar</button>`
                                : `<button class="btn-activar" onclick="cambiarEstado('${data.id}', true)">Activar</button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Función de filtrado con la Lupa
        window.filtrarUsuarios = function() {
            const texto = document.getElementById("buscador").value.toLowerCase();
            const filtrados = listaUsuariosGlobal.filter(user => {
                const nick = (user.nickname || user.nombre || '').toLowerCase();
                const email = (user.email || '').toLowerCase();
                return nick.includes(texto) || email.includes(texto);
            });
            renderizarTabla(filtrados);
        }

        window.cambiarEstado = async function(userId, activar) {
            const selectElement = document.getElementById(`duracion-${userId}`);
            const diasSeleccionados = parseInt(selectElement.value);
            const tipoTexto = diasSeleccionados === 365 ? "1 Año (Anual)" : "30 Días (Mensual)";

            if (activar) {
                if (!confirm(`¿Estás seguro de activar la cuenta por ${tipoTexto}?`)) return;
            } else {
                if (!confirm("¿Estás seguro de desactivar la cuenta de este usuario?")) return;
            }

            const fechaActual = new Date();
            const fechaExpiracion = new Date();
            fechaExpiracion.setDate(fechaActual.getDate() + diasSeleccionados);

            try {
                const userRef = doc(db, "users", userId);
                
                if (activar) {
                    await updateDoc(userRef, {
                        isPremium: true,
                        activatedAt: fechaActual.toISOString(),
                        subscriptionExpiry: fechaExpiracion.toISOString(),
                        planDurationDays: diasSeleccionados
                    });
                } else {
                    await updateDoc(userRef, {
                        isPremium: false,
                        subscriptionExpiry: null
                    });
                }

                cargarSolicitudes(); 
            } catch (error) {
                console.error("Error al cambiar estado: ", error);
                alert("Hubo un error al actualizar la cuenta.");
            }
        }

        cargarSolicitudes();
    </script>
</body>
</html>
