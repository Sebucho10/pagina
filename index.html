<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - DPdefault Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 10px; }

        .container { width: 100%; max-width: 1400px; margin: 0 auto; }

        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h2 { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        .search-box { position: relative; width: 100%; max-width: 350px; }
        .search-box input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-muted); }

        /* Notificaciones */
        #notification-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }
        .toast {
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease-out;
            font-size: 14px;
            font-weight: 600;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .table-card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }

        .user-link { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; }
        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-inactive { background-color: #f1f5f9; color: #64748b; }
        .badge-pending { background-color: #e0f2fe; color: #0369a1; border: 1px solid #0369a1; }
        .badge-expired { background-color: var(--danger); color: white; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        select { padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; }
        button { padding: 8px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-activar { background-color: var(--success); color: white; }
        .btn-desactivar { background-color: var(--danger); color: white; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 800px; padding: 24px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="notification-bar"></div>

    <div class="container">
        <div class="header-panel">
            <h2>Panel Administrativo DPdefault Pro</h2>
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
                <input type="text" id="buscador" placeholder="Buscar usuario..." onkeyup="filtrarUsuarios()">
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Plan Solicitado</th>
                        <th>Monto</th>
                        <th>Pago el</th>
                        <th>Expira el</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Historial -->
    <div id="modalHistorial" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo">Historial</h3>
                <button onclick="cerrarModal()" style="background:none; color:black; font-size:20px;">&times;</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Activación</th>
                        <th>Expiración</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let listaUsuarios = [];

        // 1. Escuchar cambios en tiempo real (Notificaciones)
        onSnapshot(collection(db, "users"), (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                const data = change.doc.data();
                if (change.type === "modified" && data.paymentReceived === true && !data.isPremium) {
                    mostrarNotificacion(`¡Pago detectado de ${data.nickname || 'un usuario'}!`);
                }
            });

            listaUsuarios = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizarTabla(listaUsuarios);
        });

        function mostrarNotificacion(msg) {
            const bar = document.getElementById("notification-bar");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            bar.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
            
            // Sonido opcional
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(() => {});
        }

        window.renderizarTabla = (usuarios) => {
            const tbody = document.getElementById("tabla-usuarios");
            tbody.innerHTML = "";
            const ahora = new Date();

            usuarios.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

            usuarios.forEach(user => {
                const expiryStr = user.subscriptionExpiry;
                const expiryDate = expiryStr ? new Date(expiryStr.replace(' ', 'T')) : null;
                const isExpired = expiryDate && ahora > expiryDate;
                const isPrem = user.isPremium === true;
                const needsDeactivation = isPrem && isExpired;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><span class="user-link" onclick="verHistorial('${user.id}', '${user.nickname}')">${user.nickname || 'Sin Nombre'}</span></td>
                    <td style="font-size:12px; color:var(--text-muted)">${user.email || '-'}</td>
                    <td><b>${user.billingCycle || 'Ninguno'}</b></td>
                    <td>$${user.amount || '0.00'}</td>
                    <td>${user.paymentDate || '-'}</td>
                    <td style="color: ${needsDeactivation ? 'red' : 'inherit'}; font-weight: ${needsDeactivation ? 'bold' : 'normal'}">
                        ${user.subscriptionExpiry || 'Sin fecha'}
                    </td>
                    <td>
                        ${needsDeactivation 
                            ? '<span class="badge badge-expired">⚠️ DESACTIVAR AHORA</span>' 
                            : `<span class="badge ${isPrem ? 'badge-active' : (user.paymentReceived ? 'badge-pending' : 'badge-inactive')}">
                                ${isPrem ? 'ACTIVO' : (user.paymentReceived ? 'PAGADO (PEND)' : 'INACTIVO')}
                               </span>`
                        }
                    </td>
                    <td>
                        <div style="display:flex; gap:5px;">
                            <select id="sel-${user.id}">
                                <option value="3">3 Días ($0.25)</option>
                                <option value="30">30 Días ($1.00)</option>
                                <option value="365">1 Año ($10.00)</option>
                            </select>
                            ${isPrem 
                                ? `<button class="btn-desactivar" onclick="desactivar('${user.id}')">Apagar</button>`
                                : `<button class="btn-activar" onclick="activar('${user.id}')">Activar</button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.activar = async (uid) => {
            const dias = parseInt(document.getElementById(`sel-${uid}`).value);
            const precios = { 3: 0.25, 30: 1.00, 365: 10.00 };
            const nombres = { 3: "Prueba (3 Días)", 30: "Mensual (30 Días)", 365: "Anual (365 Días)" };

            if (!confirm(`¿Activar ${nombres[dias]} para este usuario?`)) return;

            const ahora = new Date();
            const expira = new Date();
            expira.setDate(ahora.getDate() + dias);

            const fmt = (d) => d.toISOString().replace('T', ' ').split('.')[0];
            const fechaAct = fmt(ahora);
            const fechaExp = fmt(expira);

            try {
                const userRef = doc(db, "users", uid);
                await updateDoc(userRef, {
                    isPremium: true,
                    paymentReceived: true,
                    amount: precios[dias],
                    billingCycle: nombres[dias],
                    paymentDate: fechaAct,
                    subscriptionExpiry: fechaExp,
                    updatedAt: new Date()
                });

                await addDoc(collection(db, "users", uid, "payments"), {
                    plan: nombres[dias],
                    amount: precios[dias],
                    paymentDate: fechaAct,
                    expiresAt: fechaExp,
                    timestamp: ahora.getTime()
                });

                alert("Cuenta Activada Correctamente");
            } catch (e) { alert("Error: " + e.message); }
        };

        window.desactivar = async (uid) => {
            if (!confirm("¿Desactivar acceso Premium?")) return;
            try {
                await updateDoc(doc(db, "users", uid), {
                    isPremium: false,
                    paymentReceived: false,
                    subscriptionExpiry: "EXPIRADO"
                });
            } catch (e) { alert(e.message); }
        };

        window.verHistorial = async (uid, nombre) => {
            document.getElementById("modalTitulo").innerText = "Historial: " + nombre;
            const table = document.getElementById("tabla-historial");
            table.innerHTML = "<tr><td colspan='4'>Cargando...</td></tr>";
            document.getElementById("modalHistorial").style.display = "flex";

            const q = query(collection(db, "users", uid, "payments"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            table.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                table.innerHTML += `<tr><td>${p.plan}</td><td>$${p.amount}</td><td>${p.paymentDate}</td><td>${p.expiresAt}</td></tr>`;
            });
        };

        window.cerrarModal = () => document.getElementById("modalHistorial").style.display = "none";
        window.filtrarUsuarios = () => {
            const txt = document.getElementById("buscador").value.toLowerCase();
            renderizarTabla(listaUsuarios.filter(u => 
                (u.nickname || "").toLowerCase().includes(txt) || (u.email || "").toLowerCase().includes(txt)
            ));
        };
    </script>
</body>
</html>
