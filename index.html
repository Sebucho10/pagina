<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPdefault Pro - Admin iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-gray: #8E8E93;
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.85);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            background-color: var(--ios-bg); 
            margin: 0; padding: 30px 20px; 
            color: #000;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* Header iOS */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin: 0; }

        /* Buscador */
        .search-bar {
            background: rgba(118, 118, 128, 0.12);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            width: 280px;
        }
        .search-bar input {
            background: none; border: none; outline: none; width: 100%; font-size: 16px; margin-left: 8px;
        }

        /* Filtros */
        .filter-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .filter-btn {
            background: #E5E5EA; border: none; padding: 6px 14px; border-radius: 15px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active { background: var(--ios-blue); color: white; }

        /* Tabla iOS */
        .card {
            background: var(--ios-card);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 0.5px solid rgba(0,0,0,0.1);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 15px; font-size: 12px; color: var(--ios-gray); text-transform: uppercase; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        td { padding: 14px 15px; border-bottom: 0.5px solid rgba(0,0,0,0.05); font-size: 15px; }

        .user-link { color: var(--ios-blue); text-decoration: none; font-weight: 600; cursor: pointer; }
        .user-link:hover { text-decoration: underline; }

        /* Badges */
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .bg-green { background: rgba(52, 199, 89, 0.15); color: var(--ios-green); }
        .bg-red { background: rgba(255, 59, 48, 0.15); color: var(--ios-red); }
        .bg-gray { background: rgba(142, 142, 147, 0.15); color: var(--ios-gray); }

        /* Notificaciones */
        #notif-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .ios-notif {
            width: 300px; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px);
            padding: 15px; border-radius: 18px; margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .notif-dot { width: 12px; height: 12px; border-radius: 50%; }
        @keyframes slideIn { from { transform: translateX(110%); } to { transform: translateX(0); } }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 650px; border-radius: 20px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }

        .btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-green { background: var(--ios-green); color: white; }
        .btn-red { background: var(--ios-red); color: white; }
    </style>
</head>
<body>

    <div id="notif-container"></div>

    <div class="container">
        <header>
            <h1>DPdefault Pro</h1>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="buscador" placeholder="Buscar..." onkeyup="filtrar()">
            </div>
        </header>

        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
            <button class="filter-btn" onclick="setFilter('pagos', this)">Pagos Nuevos</button>
            <button class="filter-btn" onclick="setFilter('vencidos', this)">Vencidos</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Pago el</th>
                        <th>Expira el</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>
    </div>

    <div id="modalHistorial" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="historialTitulo" style="margin:0;">Historial</h2>
                <button onclick="cerrarModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>
            <table style="width:100%">
                <thead>
                    <tr style="background:#F2F2F7">
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Activación</th>
                        <th>Expiración</th>
                    </tr>
                </thead>
                <tbody id="historial-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let usuarios = [];
        let filtroActual = 'todos';
        const notificados = new Set();

        onSnapshot(collection(db, "users"), (snap) => {
            usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            snap.docChanges().forEach(change => {
                const u = change.doc.data();
                const id = change.doc.id;
                const ahora = new Date();
                const exp = u.subscriptionExpiry && u.subscriptionExpiry !== "EXPIRADO" ? new Date(u.subscriptionExpiry.replace(' ', 'T')) : null;

                // Notificación VERDE: Pago nuevo
                if (u.paymentReceived && !u.isPremium && !notificados.has(id + '_p')) {
                    lanzarNotif(`💰 Pago de ${u.nickname}`, `Monto: $${u.amount}`, 'var(--ios-green)');
                    notificados.add(id + '_p');
                }

                // Notificación ROJA: Debe desactivarse
                if (u.isPremium && exp && ahora > exp && !notificados.has(id + '_e')) {
                    lanzarNotif(`🚨 VENCIDO: ${u.nickname}`, `Desactivar suscripción ahora.`, 'var(--ios-red)');
                    notificados.add(id + '_e');
                }
            });
            render();
        });

        function lanzarNotif(titulo, msg, color) {
            const container = document.getElementById("notif-container");
            const div = document.createElement("div");
            div.className = "ios-notif";
            div.innerHTML = `
                <div class="notif-dot" style="background:${color}"></div>
                <div>
                    <div style="font-weight:700; font-size:15px;">${titulo}</div>
                    <div style="font-size:13px; color:var(--ios-gray)">${msg}</div>
                </div>
            `;
            container.appendChild(div);
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(()=>{});
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 500); }, 5000);
        }

        window.render = () => {
            const body = document.getElementById("tabla-body");
            body.innerHTML = "";
            const ahora = new Date();

            let filtrados = usuarios.filter(u => {
                const busqueda = document.getElementById("buscador").value.toLowerCase();
                const coincide = (u.nickname || "").toLowerCase().includes(busqueda) || (u.email || "").toLowerCase().includes(busqueda);
                if (filtroActual === 'pagos') return coincide && u.paymentReceived && !u.isPremium;
                if (filtroActual === 'vencidos') {
                    const exp = u.subscriptionExpiry && u.subscriptionExpiry !== "EXPIRADO" ? new Date(u.subscriptionExpiry.replace(' ', 'T')) : null;
                    return coincide && u.isPremium && exp && ahora > exp;
                }
                return coincide;
            });

            filtrados.forEach(u => {
                const expDate = u.subscriptionExpiry && u.subscriptionExpiry !== "EXPIRADO" ? new Date(u.subscriptionExpiry.replace(' ', 'T')) : null;
                const vencido = expDate && ahora > expDate;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><a class="user-link" onclick="verHistorial('${u.id}', '${u.nickname}')">${u.nickname || 'User'}</a></td>
                    <td><b>${u.billingCycle || '-'}</b></td>
                    <td>$${u.amount || '0.00'}</td>
                    <td>${u.paymentDate || '-'}</td>
                    <td style="color: ${vencido ? 'var(--ios-red)' : 'inherit'}; font-weight: ${vencido ? '700' : '400'}">
                        ${u.subscriptionExpiry || '-'}
                    </td>
                    <td>
                        <span class="badge ${u.isPremium ? (vencido ? 'bg-red' : 'bg-green') : 'bg-gray'}">
                            ${u.isPremium ? (vencido ? 'VENCIDO' : 'ACTIVO') : 'INACTIVO'}
                        </span>
                    </td>
                    <td>
                        <div style="display:flex; gap:8px;">
                            <select id="sel-${u.id}">
                                <option value="3">3 Días</option>
                                <option value="30" selected>1 Mes</option>
                                <option value="365">1 Año</option>
                            </select>
                            ${u.isPremium 
                                ? `<button class="btn btn-red" onclick="apagar('${u.id}')">Apagar</button>`
                                : `<button class="btn btn-green" onclick="activar('${u.id}')">Activar</button>`
                            }
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });
        };

        window.activar = async (id) => {
            const dias = parseInt(document.getElementById(`sel-${id}`).value);
            const precios = { 3: 0.25, 30: 1.00, 365: 10.00 };
            const nombres = { 3: "Prueba 3D", 30: "Mensual", 365: "Anual" };
            const ahora = new Date();
            const exp = new Date(); exp.setDate(ahora.getDate() + dias);
            const fmt = (d) => d.toISOString().replace('T', ' ').split('.')[0];

            await updateDoc(doc(db, "users", id), {
                isPremium: true, paymentReceived: true,
                amount: precios[dias], billingCycle: nombres[dias],
                paymentDate: fmt(ahora), subscriptionExpiry: fmt(exp), updatedAt: ahora
            });
            
            await addDoc(collection(db, "users", id, "payments"), {
                plan: nombres[dias], amount: precios[dias],
                paymentDate: fmt(ahora), expiresAt: fmt(exp), timestamp: ahora.getTime()
            });
        };

        window.apagar = async (id) => {
            if(!confirm("¿Desactivar?")) return;
            await updateDoc(doc(db, "users", id), { isPremium: false, paymentReceived: false });
        };

        window.verHistorial = async (id, nombre) => {
            document.getElementById("historialTitulo").innerText = "Historial: " + nombre;
            const body = document.getElementById("historial-body");
            body.innerHTML = "<tr><td colspan='4' style='text-align:center'>Cargando...</td></tr>";
            document.getElementById("modalHistorial").style.display = "flex";

            try {
                const q = query(collection(db, "users", id, "payments"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                body.innerHTML = "";
                if(snap.empty) body.innerHTML = "<tr><td colspan='4' style='text-align:center'>Sin pagos previos</td></tr>";
                snap.forEach(d => {
                    const p = d.data();
                    body.innerHTML += `<tr><td>${p.plan}</td><td>$${p.amount}</td><td>${p.paymentDate}</td><td>${p.expiresAt}</td></tr>`;
                });
            } catch (e) { body.innerHTML = "<tr><td colspan='4'>Error al cargar</td></tr>"; }
        };

        window.cerrarModal = () => document.getElementById("modalHistorial").style.display = "none";
        window.setFilter = (f, btn) => {
            filtroActual = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        };
        window.filtrar = () => render();
    </script>
</body>
</html>
