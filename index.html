<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Pago - Suscripción</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #4f46e5; margin-bottom: 10px; font-size: 1.25rem; }
        p { color: #64748b; font-size: 14px; margin: 0; }
        .spinner {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="mensajeEstado">Procesando tu pago...</h2>
        <p id="subMensaje">Por favor, no cierres esta ventana mientras confirmamos tu suscripción.</p>
        <div class="spinner" id="loader"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw98_ayavN4p2Lk-P-1Fz-_f7bKrY_TAl0",
            authDomain: "dpdefault-48735.firebaseapp.com",
            projectId: "dpdefault-48735",
            storageBucket: "dpdefault-48735.firebasestorage.app",
            messagingSenderId: "176010812894",
            appId: "1:176010812894:web:aab3ff030cf228a0d3914f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function procesarRetornoPago() {
            const urlParams = new URLSearchParams(window.location.search);
            const txId = urlParams.get('tx') || urlParams.get('token') || 'DESCONOCIDO';
            const monto = urlParams.get('amt') || '1.00';
            
            const userId = localStorage.getItem('currentUserId') || sessionStorage.getItem('currentUserId');

            document.getElementById("mensajeEstado").innerText = "¡Pago exitoso!";
            document.getElementById("subMensaje").innerText = "Estamos activando tu cuenta premium automáticamente...";

            try {
                if (userId) {
                    const ahora = new Date();
                    const expira = new Date();
                    expira.setDate(ahora.getDate() + 30);

                    const userRef = doc(db, "users", userId);
                    await setDoc(userRef, {
                        isPremium: true,
                        paymentReceived: true,
                        amount: parseFloat(monto),
                        paymentDate: ahora.toISOString(),
                        billingCycle: "Mensual",
                        expiresAt: expira.toISOString()
                    }, { merge: true });

                    const paymentRef = doc(collection(db, "users", userId, "payments"));
                    await setDoc(paymentRef, {
                        txId: txId,
                        amount: parseFloat(monto),
                        plan: "Mensual",
                        paymentDate: ahora.toISOString(),
                        expiresAt: expira.toISOString(),
                        timestamp: serverTimestamp()
                    });
                }

                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 2000);

            } catch (error) {
                console.error("Error al registrar el pago en Firebase:", error);
                document.getElementById("mensajeEstado").innerText = "Error al sincronizar";
                document.getElementById("subMensaje").innerText = "El pago se realizó, pero hubo un problema al actualizar la app.";
                document.getElementById("loader").style.display = "none";
            }
        }

        procesarRetornoPago();
    </script>
</body>
</html>
